name: Deploy site to GitHub Pages

on:
  push:
    branches: [react-migration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - name: Build
        run: npm run build
        working-directory: app
      - name: SPA fallback + static route pages (real 200 on deep-links)
        run: |
          cd app/dist
          # 404.html boots the SPA for any unknown path (client-side routing).
          cp index.html 404.html
          # Emit a real file per known route so hard-loads / crawlers (e.g. Meta
          # fetching the privacy-policy URL) get HTTP 200 instead of the 404 fallback.
          for r in services work about contact privacy; do
            cp index.html "$r.html"        # served at /$r  (clean URL)
            mkdir -p "$r" && cp index.html "$r/index.html"  # served at /$r/
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
